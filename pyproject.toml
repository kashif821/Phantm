[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phantm"
version = "0.1.0"
description = "CLI-first security scanner for LLM-generated code"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic-settings>=2.1.0",
    "tomlkit>=0.12.0",
]

[project.scripts]
phantm = "phantm.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/phantm"]
